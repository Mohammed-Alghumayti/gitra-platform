# Fully automatic deployment of the Gitra platform.
# Every push to Testing (or a manual run) does all of this, end to end:
#   0. Terraform manages the GitLab platform (RG, VNet, subnet, NSG, IP, VM) —
#      existing resources are imported, never recreated
#   1. Prepares the existing GitLab VM on Azure (static IP, DNS name, NSG, deploy user)
#   2. Deploys/updates GitLab on it with HTTPS + security settings, sets root's password
#   3. Creates/updates the runner VM with Terraform (state kept in Azure Storage).
#      It lives in another region (RUNNER_LOCATION) because the GitLab VM uses
#      the whole 4-core quota of its region.
#   4. Registers the runner with GitLab (only when needed)
#   5. Pushes sample-app/ to GitLab and waits for its pipeline
# One-time setup (secrets): see "Automatic deployment" in README.md.
name: Deploy Gitra Platform

on:
  push:
    branches: [Testing]
    # Docs-only changes don't need a redeploy.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: gitra-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLAB_VM_IP: ${{ vars.GITLAB_VM_IP || '20.55.88.3' }}
  DNS_LABEL: ${{ vars.DNS_LABEL }}
  RUNNER_LOCATION: ${{ vars.RUNNER_LOCATION }}
  RUNNER_VM_SIZE: ${{ vars.RUNNER_VM_SIZE }}
  DEPLOY_USER: gitra-deploy
  RUNNER_USER: azureuser
  TF_STATE_RG: gitra-tfstate-rg
  SSH_OPTS: -i ~/.ssh/gitra -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check one-time setup
        id: setup
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GITLAB_ROOT_PASSWORD: ${{ secrets.GITLAB_ROOT_PASSWORD }}
        run: |
          missing=""
          [ -n "$AZURE_CREDENTIALS" ] || missing="$missing AZURE_CREDENTIALS"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$GITLAB_ROOT_PASSWORD" ] || missing="$missing GITLAB_ROOT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Deployment skipped — missing secrets:$missing. See README → Automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - name: Azure login
        if: steps.setup.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: SSH key
        if: steps.setup.outputs.ready == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/gitra
          chmod 600 ~/.ssh/gitra
          ssh-keygen -y -f ~/.ssh/gitra > ~/.ssh/gitra.pub

      - name: "0a. Terraform credentials and state storage"
        id: tfstate
        if: steps.setup.outputs.ready == 'true'
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          # Service principal for Terraform (both configs). Mask the secret first.
          SECRET=$(jq -r .clientSecret <<< "$AZURE_CREDENTIALS")
          echo "::add-mask::$SECRET"
          {
            echo "ARM_CLIENT_ID=$(jq -r .clientId <<< "$AZURE_CREDENTIALS")"
            echo "ARM_CLIENT_SECRET=$SECRET"
            echo "ARM_TENANT_ID=$(jq -r .tenantId <<< "$AZURE_CREDENTIALS")"
            echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId <<< "$AZURE_CREDENTIALS")"
            echo "TF_VAR_subscription_id=$(jq -r .subscriptionId <<< "$AZURE_CREDENTIALS")"
          } >> "$GITHUB_ENV"
          # Storage account for Terraform state, created once.
          SUB=$(az account show --query id -o tsv)
          SA="gitratf$(printf '%s' "$SUB" | sha256sum | cut -c1-12)"
          az group show -n "$TF_STATE_RG" -o none 2>/dev/null || az group create -n "$TF_STATE_RG" -l eastus -o none
          if ! az storage account show -n "$SA" -g "$TF_STATE_RG" -o none 2>/dev/null; then
            az storage account create -n "$SA" -g "$TF_STATE_RG" -l eastus \
              --sku Standard_LRS --min-tls-version TLS1_2 --allow-blob-public-access false -o none
          fi
          KEY=$(az storage account keys list -n "$SA" -g "$TF_STATE_RG" --query '[0].value' -o tsv)
          echo "::add-mask::$KEY"
          az storage container create -n tfstate --account-name "$SA" --account-key "$KEY" -o none
          echo "account=$SA" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: steps.setup.outputs.ready == 'true'
        with:
          terraform_wrapper: false

      - name: "0b. GitLab platform (Terraform)"
        if: steps.setup.outputs.ready == 'true'
        working-directory: terraform/gitlab
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=${{ steps.tfstate.outputs.account }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=gitra-gitlab.tfstate"
          # Adopt the existing platform resources (changes nothing in Azure).
          bash import_existing.sh
          terraform plan -input=false -out=platform.tfplan
          terraform show -json platform.tfplan > plan.json
          # Safety rules for the VM that holds all of GitLab's data:
          #  - never apply a plan that deletes or replaces anything
          #  - only apply automatically when nothing existing would be modified
          DELETES=$(jq -r '[.resource_changes[] | select(.change.actions | index("delete")) | .address] | join(", ")' plan.json)
          UPDATES=$(jq -r '[.resource_changes[] | select(.change.actions | index("update")) | .address] | join(", ")' plan.json)
          if [ -n "$DELETES" ]; then
            echo "::error::Refusing to apply: the plan would delete/replace: $DELETES"
            exit 1
          fi
          if [ -n "$UPDATES" ]; then
            echo "::warning::Not applied — the plan would modify existing resources: $UPDATES. Review the plan above and align terraform/gitlab with Azure."
            exit 0
          fi
          terraform apply -input=false platform.tfplan
          echo "✅ GitLab platform is managed by Terraform (no existing resource modified)."

      - name: "1. Prepare GitLab VM on Azure"
        id: vm
        if: steps.setup.outputs.ready == 'true'
        run: |
          SSH_PUBLIC_KEY="$(cat ~/.ssh/gitra.pub)"
          export SSH_PUBLIC_KEY
          bash scripts/ci/azure_prepare_gitlab_vm.sh

      - name: "2. Deploy GitLab (HTTPS + security settings)"
        if: steps.setup.outputs.ready == 'true'
        run: |
          # The deploy script is idempotent, so a dropped SSH connection (exit 255) is retried.
          for attempt in 1 2 3; do
            rc=0
            # shellcheck disable=SC2086
            ssh $SSH_OPTS -o ServerAliveInterval=15 "$DEPLOY_USER@$GITLAB_VM_IP" \
              "sudo bash -s -- '${{ github.server_url }}/${{ github.repository }}.git' '${{ github.ref_name }}' 'https://${{ steps.vm.outputs.fqdn }}'" \
              < scripts/ci/remote_deploy_gitlab.sh || rc=$?
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 255 ] || exit "$rc"
            echo "::warning::SSH connection dropped (attempt $attempt/3) — retrying in 30s"
            sleep 30
          done
          exit 1

      - name: "2b. Set root password"
        if: steps.setup.outputs.ready == 'true'
        env:
          GITLAB_ROOT_PASSWORD: ${{ secrets.GITLAB_ROOT_PASSWORD }}
        run: |
          OUT=$(bash scripts/ci/run_gitlab_bootstrap.sh 0 1)
          if grep -q '^ROOT_PASSWORD_UPDATED=1' <<< "$OUT"; then
            echo "root password updated from the GITLAB_ROOT_PASSWORD secret"
          else
            echo "root password already matches the secret"
          fi

      - name: "3. Runner VM (Terraform)"
        id: tf
        if: steps.setup.outputs.ready == 'true'
        working-directory: terraform/runner
        run: |
          TF_VAR_admin_username="$RUNNER_USER"
          TF_VAR_admin_ssh_public_key="$(cat ~/.ssh/gitra.pub)"
          TF_VAR_gitlab_url="https://${{ steps.vm.outputs.fqdn }}"
          TF_VAR_repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          TF_VAR_repo_branch="${{ github.ref_name }}"
          export TF_VAR_admin_username TF_VAR_admin_ssh_public_key TF_VAR_gitlab_url TF_VAR_repo_url TF_VAR_repo_branch
          terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=${{ steps.tfstate.outputs.account }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=gitra-runner.tfstate"
          # Student subscriptions often have no capacity for a size in a region
          # (SkuNotAvailable / "Allocation failed"). Try small 2-vCPU sizes in
          # several regions, first one Azure accepts wins. eastus is skipped:
          # the GitLab VM already uses that region's whole 4-vCPU quota.
          # RUNNER_LOCATION / RUNNER_VM_SIZE (repo variables) pin one value.
          LOCATIONS="${RUNNER_LOCATION:-westus2 centralus eastus2 westus3 northeurope}"
          SIZES="${RUNNER_VM_SIZE:-Standard_B2s Standard_B2als_v2 Standard_B2as_v2 Standard_B2s_v2 Standard_D2as_v5 Standard_D2s_v5 Standard_D2s_v3}"
          RUNNER_RG="gitra-runner-rg"
          # An existing runner VM keeps its region and size: try those first,
          # so a run never resizes (= reboots) a VM that already works.
          CURRENT=$(az vm show -g "$RUNNER_RG" -n gitra-runner-vm \
            --query "[location, hardwareProfile.vmSize]" -o tsv 2>/dev/null | tr '\t\n' '  ' || true)
          if [ -n "$CURRENT" ]; then
            read -r cur_loc cur_size <<< "$CURRENT"
            first() { local x out="$1"; for x in $2; do [ "$x" = "$1" ] || out="$out $x"; done; echo "$out"; }
            [ -n "${RUNNER_LOCATION:-}" ] || LOCATIONS=$(first "$cur_loc" "$LOCATIONS")
            [ -n "${RUNNER_VM_SIZE:-}" ] || SIZES=$(first "$cur_size" "$SIZES")
          fi

          # A failed allocation can leave a half-created VM (and its disk) that
          # Terraform doesn't track; the next attempt would then fail with
          # "already exists". Remove such leftovers before each attempt.
          cleanup_failed_vm() {
            if ! terraform state list 2>/dev/null | grep -qx 'azurerm_linux_virtual_machine.runner' &&
               az vm show -g "$RUNNER_RG" -n gitra-runner-vm -o none 2>/dev/null; then
              echo "Removing a half-created runner VM left by a failed attempt..."
              az vm delete -g "$RUNNER_RG" -n gitra-runner-vm --yes -o none
            fi
            for disk in $(az disk list -g "$RUNNER_RG" --query "[?managedBy==null].id" -o tsv 2>/dev/null); do
              az disk delete --ids "$disk" --yes -o none
            done
          }

          # A stopped (deallocated) VM must also find capacity to start again.
          # If it can't, the loop moves on: another size (resized in place)
          # or another region (Terraform rebuilds the disposable runner VM).
          start_runner() {
            local power
            power=$(az vm get-instance-view -g "$RUNNER_RG" -n gitra-runner-vm \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)
            [ "$power" = "PowerState/running" ] && return 0
            echo "Runner VM is ${power#PowerState/} — starting it..."
            az vm start -g "$RUNNER_RG" -n gitra-runner-vm -o none
          }

          applied=""
          for loc in $LOCATIONS; do
            for size in $SIZES; do
              echo "--- Trying runner size $size in $loc ---"
              cleanup_failed_vm
              if terraform apply -input=false -auto-approve -var "location=$loc" -var "runner_vm_size=$size" &&
                 start_runner; then
                applied="$size in $loc"
                break 2
              fi
            done
          done
          if [ -z "$applied" ]; then
            echo "::error::No runner VM size had capacity in: $LOCATIONS. Set RUNNER_LOCATION (repo variable) to another region your subscription allows."
            exit 1
          fi
          echo "✅ Runner VM: $applied (running)"
          echo "runner_ip=$(terraform output -raw runner_public_ip)" >> "$GITHUB_OUTPUT"
          echo "staging_url=$(terraform output -raw staging_app_url)" >> "$GITHUB_OUTPUT"

      - name: "3b. Wait for runner VM and update it"
        id: runner
        if: steps.setup.outputs.ready == 'true'
        run: |
          IP="${{ steps.tf.outputs.runner_ip }}"
          reachable=""
          for _ in $(seq 1 30); do
            # shellcheck disable=SC2086
            ssh $SSH_OPTS "$RUNNER_USER@$IP" true 2>/dev/null && { reachable=1; break; }
            sleep 10
          done
          if [ -z "$reachable" ]; then
            echo "::error::Runner VM ($IP) not reachable over SSH after 5 minutes. Check gitra-runner-vm in the Azure portal (status, boot diagnostics) and that its NSG allows port 22."
            exit 1
          fi
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$RUNNER_USER@$IP" "sudo cloud-init status --wait >/dev/null || true
            cd ~/gitra-platform
            git fetch -q --depth 1 origin '${{ github.ref_name }}' && git checkout -q -f -B '${{ github.ref_name }}' FETCH_HEAD
            sudo bash scripts/deploy_runner.sh"
          # shellcheck disable=SC2086
          if ssh $SSH_OPTS "$RUNNER_USER@$IP" "sudo grep -q 'token = ' ~/gitra-platform/runner/config.toml" 2>/dev/null; then
            echo "need_runner=0" >> "$GITHUB_OUTPUT"
          else
            echo "need_runner=1" >> "$GITHUB_OUTPUT"
          fi

      - name: "4a. GitLab tokens (runner + temporary push token)"
        id: boot
        if: steps.setup.outputs.ready == 'true'
        env:
          GITLAB_ROOT_PASSWORD: ${{ secrets.GITLAB_ROOT_PASSWORD }}
        run: |
          OUT=$(bash scripts/ci/run_gitlab_bootstrap.sh "${{ steps.runner.outputs.need_runner }}" 0)
          PAT=$(grep '^PAT=' <<< "$OUT" | cut -d= -f2-)
          RUNNER_TOKEN=$(grep '^RUNNER_TOKEN=' <<< "$OUT" | cut -d= -f2- || true)
          echo "::add-mask::$PAT"
          [ -z "$RUNNER_TOKEN" ] || echo "::add-mask::$RUNNER_TOKEN"
          echo "pat=$PAT" >> "$GITHUB_OUTPUT"
          echo "runner_token=$RUNNER_TOKEN" >> "$GITHUB_OUTPUT"

      - name: "4b. Register runner"
        if: steps.setup.outputs.ready == 'true' && steps.runner.outputs.need_runner == '1'
        run: |
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$RUNNER_USER@${{ steps.tf.outputs.runner_ip }}" \
            "cd ~/gitra-platform && sudo bash scripts/register_runner.sh '${{ steps.boot.outputs.runner_token }}' 'https://${{ steps.vm.outputs.fqdn }}'"

      - name: "5. Push demo app and run its pipeline"
        if: steps.setup.outputs.ready == 'true'
        env:
          GITLAB_URL: https://${{ steps.vm.outputs.fqdn }}
          GITLAB_PAT: ${{ steps.boot.outputs.pat }}
        run: bash scripts/ci/push_demo_app.sh

      - name: Revoke temporary token
        if: always() && steps.boot.outputs.pat != ''
        run: |
          curl -sf -X DELETE -H "PRIVATE-TOKEN: ${{ steps.boot.outputs.pat }}" \
            "https://${{ steps.vm.outputs.fqdn }}/api/v4/personal_access_tokens/self" || true

      - name: Summary
        if: always() && steps.setup.outputs.ready == 'true'
        run: |
          {
            echo "## Gitra Platform"
            echo "| | |"
            echo "|---|---|"
            echo "| GitLab | https://${{ steps.vm.outputs.fqdn }} |"
            echo "| Login | \`root\` + the GITLAB_ROOT_PASSWORD secret (2FA set up on first login) |"
            echo "| Demo project | https://${{ steps.vm.outputs.fqdn }}/root/internal-demo-app |"
            echo "| Staging app | ${{ steps.tf.outputs.staging_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
