# GitLab server (runs on the GitLab VM). The CI runner lives on its own VM —
# see docker-compose.runner.yaml.
services:
  web:
    image: 'gitlab/gitlab-ce:latest'
    container_name: gitlab_server
    restart: always
    hostname: 'gitlab.local'
    environment:
      # GITLAB_EXTERNAL_URL comes from .env (written by the deploy workflow).
      # With an https:// URL GitLab requests a Let's Encrypt certificate
      # automatically and redirects HTTP to HTTPS.
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://20.55.88.3}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    # HOST:CONTAINER — each host port also needs an Azure NSG rule.
    ports:
      # HTTP: only redirects to HTTPS and answers Let's Encrypt challenges.
      - '80:80'
      # HTTPS: the GitLab web UI, encrypted.
      - '443:443'
      # Git over SSH. Host port 22 is kept for the VM's admin SSH, so Git
      # traffic is separated from server access. Must match gitlab_shell_ssh_port.
      - '2224:22'
    volumes:
      - './gitlab/config:/etc/gitlab'
      - './gitlab/logs:/var/log/gitlab'
      - './gitlab/data:/var/opt/gitlab'
    shm_size: '256m'
