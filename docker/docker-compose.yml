version: "3.8"

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: "gitlab.local"
    environment:
      # TODO: replace with the real VM public IP or DNS name once Member 1
      # hands it over. Everything else can stay as-is for the demo.
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://CHANGE_TO_VM_PUBLIC_IP'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
      - "80:80"
      - "443:443"
      - "2224:22"   # mapped away from 22 since the VM's own SSH already uses it
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data: